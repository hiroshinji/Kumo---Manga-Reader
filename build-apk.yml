name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK (debug)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Conferir bibliotecas embutidas no APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/(index.html|lib/jszip.min.js|lib/pdf.min.js|lib/pdf.worker.min.js)" | tee /tmp/assets.txt
          test "$(wc -l < /tmp/assets.txt)" -eq 4

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kumo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kumo-APK
          path: Kumo.apk

      - name: Publicar em Releases (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kumo.apk
