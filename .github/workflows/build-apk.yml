name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair e validar o projeto ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 -type f -iname '*.zip'
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Esperado um único ZIP na raiz."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f
            exit 1
          fi

          PROJECT_DIR="$GITHUB_WORKSPACE/_kumo_project"
          mkdir -p "$PROJECT_DIR"
          unzip -q "${ZIPS[0]}" -d "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] ||
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::O ZIP não contém a estrutura Android esperada."
            find "$PROJECT_DIR" -maxdepth 5 -type f | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado e validado."

      - name: Verificar ambiente
        run: |
          java -version
          sdkmanager --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Compilar APK
        run: |
          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK e bibliotecas
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          unzip -l "$APK" | grep -E \
            'assets/(index.html|lib/jszip.min.js|lib/pdf.min.js|lib/pdf.worker.min.js)' \
            | tee /tmp/assets.txt

          test "$(wc -l < /tmp/assets.txt)" -eq 4
          echo "APK e bibliotecas verificados."

      - name: Preparar APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/Kumo.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kumo-APK
          path: Kumo.apk
          if-no-files-found: error

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kumo.apk
